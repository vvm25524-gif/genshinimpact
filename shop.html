    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://gstatic.com";
        import { getAnalytics } from "https://gstatic.com";
        const firebaseConfig = {
            apiKey: "AIzaSyAY2elpwn-J-YKIPJjGfrrcqswmvhKw1Qo",
            authDomain: "://firebaseapp.com",
            projectId: "genshin-store-db",
            storageBucket: "genshin-store-db.firebasestorage.app",
            messagingSenderId: "85291683727",
            appId: "1:85291683727:web:f749cfa19dbd52c10085fa",
            measurementId: "G-XP62K98X31"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);
        const provider = new GoogleAuthProvider();
        let currentUser = null;
        window.loginInShop = function() {
            signInWithPopup(auth, provider).catch((error) => console.error(error));
        }
        onAuthStateChanged(auth, (user) => {
            const chatWrapper = document.getElementById("chat-box-wrapper");
            if (user) {
                currentUser = user;
                chatWrapper.innerHTML = `
                    <div class="chat-title">💬 Чат по сделке (Вы вошли как ${user.displayName})</div>
                    <div id="chat-box"></div>
                    <div class="chat-input-row">
                        <input type="text" id="chat-input" placeholder="Напишите ваш UID, сервер и заказ...">
                        <button class="send-btn" onclick="sendMessage()">Отправить</button>
                    </div>
                `;
                loadMessages();
            } else {
                currentUser = null;
                chatWrapper.innerHTML = `
                    <div class="chat-login-block">
                        <p class="chat-notice">Чтобы обсудить заказ и отправить данные продавцу, откройте чат поддержки</p>
                        <button class="google-login-btn" onclick="loginInShop()">🔑 Войти через Google для чата</button>
                    </div>
                `;
            }
        });
        window.sendMessage = async function() {
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (!text || !currentUser) return;
            await addDoc(collection(db, "messages"), {
                userId: currentUser.uid,
                userName: currentUser.displayName,
                userAvatar: currentUser.photoURL,
                text: text,
                timestamp: new Date()
            });
            input.value = "";
        }
        function loadMessages() {
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById("chat-box");
                if(!box) return;
                box.innerHTML = "";
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMy = msg.userId === currentUser.uid;
                    box.innerHTML += `
                        <div class="msg-row ${isMy ? 'my' : ''}">
                            <img src="${msg.userAvatar}" class="chat-av">
                            <div class="msg-bubble">
                                <div class="chat-name">${msg.userName}</div>
                                <div>${msg.text}</div>
                            </div>
                        </div>
                    `;
                });
                box.scrollTop = box.scrollHeight;
            });
        }
